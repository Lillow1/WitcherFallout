; Witcher Camera for Fallout 4 1.10.163
; Install to Data/F4SE/Plugins/WitcherCamera.ini
; Distances are game units (1 unit ~ 1.4 cm). Angles are degrees.
; Delete a line to fall back to its default.

; ---- Framing ---------------------------------------------------------------
; Third-person camera placement per situation. The camera blends between these.
;   fShoulderX  right of the character (swap shoulders with the C key)
;   fShoulderZ  up
;   fDistance   extra pull-back
;   fFOV        0 = leave the game's FOV alone

[Framing.Exploration]
fShoulderX = 35
fShoulderZ = 5
fDistance  = 50
fFOV       = 0

[Framing.Combat]
fShoulderX = 45
fShoulderZ = 0
fDistance  = 20
fFOV       = 0

[Framing.Melee]
fShoulderX = 30
fShoulderZ = -5
fDistance  = 60
fFOV       = 0

[Camera]
fFramingBlendTime   = 0.45   ; seconds to ease between framings
fLockYawSmoothTime  = 0.12   ; lower = snappier lock-on turning
fLockPitchSmoothTime = 0.18
fLockPitchBiasDeg   = 8      ; look a little down at the target to keep the ground in view
fLockPitchMinDeg    = -25
fLockPitchMaxDeg    = 30
fLockMinDistance    = 60     ; closer than this, stop re-aiming (prevents spinning)
fGroupRadius        = 1200   ; hostiles within this count as "nearby"
fGroupZoomPerEnemy  = 15     ; pull back per extra nearby hostile
fGroupZoomMax       = 90
fLargeTargetZoom    = 80     ; extra pull-back when locked onto big creatures
fShakeMaxYawDeg     = 1.5
fShakeMaxPitchDeg   = 1.2
fShakeDecay         = 2.5
fShakeFrequency     = 18

; ---- Lock-on -----------------------------------------------------------------

[LockOn]
fMaxDistance      = 2000   ; acquire range
fMaxAngleDeg      = 60     ; acquire cone, each side of center
fAngleWeight      = 0.7    ; prefer centered targets...
fDistanceWeight   = 0.3    ; ...over close ones
bHostileOnly      = 1
fBreakDistance    = 2600   ; lock drops beyond this
fLOSGraceSeconds  = 1.5
fSwitchThreshold  = 0.6    ; how hard to flick to change target
fSwitchCooldown   = 0.35
fSwitchDecay      = 4.0
bReleaseOnTargetDeath = 0  ; 0 = hop to the next enemy, like Witcher 3

; ---- Soft lock (attack magnetism, no lock-on needed) --------------------------

[SoftLock]
bEnabled        = 1
fMaxDistance    = 350
fMaxAngleDeg    = 35
fAngleWeight    = 0.6
fDistanceWeight = 0.4
bHostileOnly    = 1
fSnapTime       = 0.08     ; seconds to turn into the target when an attack starts

; ---- Signs -----------------------------------------------------------------
; Costs are Action Points. Ranges are game units (about 70 = 1 m).
; fConeDeg is the cone's full width. The "Alt" values are the held cast.
; Effects themselves are spells set up in the Creation Kit (see signs/README.md).

[Signs]
fAltHold         = 0.4   ; hold the cast key this long for the alternate cast
bAimAtLockTarget = 1     ; cones point at the lock-on target instead of the camera

[Signs.Aard]             ; knockback cone; held: weaker blast all around you
fApCost = 30
fCooldown = 1.0
fRange = 600
fConeDeg = 70
iMaxTargets = 6
fAltApCost = 50
fAltCooldown = 2.0
fAltRange = 400
fAltConeDeg = 360
iAltMaxTargets = 8
bAffectsNonHostile = 0

[Signs.Igni]             ; fire cone; held: longer, narrower stream
fApCost = 30
fCooldown = 1.0
fRange = 500
fConeDeg = 50
iMaxTargets = 4
fAltApCost = 55
fAltCooldown = 2.0
fAltRange = 700
fAltConeDeg = 30
iAltMaxTargets = 6
bAffectsNonHostile = 0

[Signs.Yrden]            ; slows everyone around you; held: wider circle
fApCost = 35
fCooldown = 1.5
fRange = 350
iMaxTargets = 8
fAltApCost = 50
fAltCooldown = 3.0
fAltRange = 500
iAltMaxTargets = 10
bAffectsNonHostile = 0

[Signs.Quen]             ; shield on you; held: stronger shield
fApCost = 40
fCooldown = 1.5
fAltApCost = 60
fAltCooldown = 3.0

[Signs.Axii]             ; calms one enemy (lock-on target, else the one ahead); held: longer, further
fApCost = 35
fCooldown = 1.5
fRange = 800
fConeDeg = 30
fAltApCost = 50
fAltCooldown = 3.0
fAltRange = 1000
fAltConeDeg = 30
bAffectsNonHostile = 0

; ---- Input -------------------------------------------------------------------
; Keyboard keys are Windows virtual-key codes (FO4 reports these, not DirectInput scan codes). Gamepad buttons are XInput masks.

[Input]
iLockOnKey       = 0x5A    ; Z
iShoulderSwapKey = 0x43    ; C
iLockOnGamepad   = 0x0080  ; right stick click
fMouseFlickScale = 0.006   ; higher = easier to flick between targets with the mouse
fStickFlickScale = 6.0
