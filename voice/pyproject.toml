[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fo4voice"
version = "0.1.0"
description = "Replace the Fallout 4 player voice with an original TTS voice"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kokoro = ["kokoro", "soundfile"]
test = ["pytest"]

[project.scripts]
fo4voice = "fo4voice.cli:main"

[tool.setuptools]
packages = ["fo4voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
